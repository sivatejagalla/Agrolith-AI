name: agrolith_ai
description: "Agrolith-AI: AI-Powered Smart Farming Assistant - Premium Dark Glassmorphic Flutter MVP"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & Routing
  flutter_riverpod: ^2.4.9
  go_router: ^13.1.0

  # Network & API
  dio: ^5.4.0
  http: ^1.2.0

  # Storage & Utilities
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.1.0
  uuid: ^4.3.3

  # UI & Animations
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0
  font_awesome_flutter: ^10.7.0
  fl_chart: ^0.66.2

  # Media & Hardware
  image_picker: ^1.0.7
  audioplayers: ^6.0.0
  record: ^5.0.5
  permission_handler: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
